name: .NET CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: .
  PROJECT_API_PATH: API/API.csproj
  DOTNET_VERSION: '9.0.x'
  # Variáveis para os nomes dos recursos no Azure
  AZURE_STAGING_APP_NAME: app-consumoenergia-staging # <-- Mude se usou outro nome
  AZURE_PRODUCTION_APP_NAME: app-consumoenergia-prod # <-- Mude se usou outro nome

jobs:
  build-e-test:
    name: Build, Test e Push da Imagem Docker
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "SenhaBanco!1"
        ports:
          - 1433:1433

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependências
        run: dotnet restore ${{ env.SOLUTION_FILE_PATH }}

      - name: Build do projeto
        run: dotnet build ${{ env.SOLUTION_FILE_PATH }} --configuration Release --no-restore

      - name: Executar testes
        run: dotnet test ${{ env.SOLUTION_FILE_PATH }} --no-build --verbosity normal
        env:
          ConnectionStrings__Container: "Data Source=mssql;Initial Catalog=consumoenergia;TrustServerCertificate=true;User Id=sa;Password=SenhaBanco!1;"

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: API/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_lower }}:${{ github.sha }}
        # Usar github.repository_lower para garantir que o nome da imagem está em minúsculas
        id: docker_build

  deploy-staging:
    name: Deploy para Staging
    needs: build-e-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://${{ env.AZURE_STAGING_APP_NAME }}.azurewebsites.net

    steps:
      - name: Deploy no Azure Web App para Staging
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_STAGING_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_STAGING }}
          images: ghcr.io/${{ github.repository_lower }}:${{ github.sha }}

  deploy-production:
    name: Deploy para Produção
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://${{ env.AZURE_PRODUCTION_APP_NAME }}.azurewebsites.net

    steps:
      - name: Deploy no Azure Web App para Produção
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_PRODUCTION_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_PRODUCTION }}
          images: ghcr.io/${{ github.repository_lower }}:${{ github.sha }}