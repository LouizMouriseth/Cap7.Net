trigger:
- main  # ou master, dependendo do seu branch

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'Cap7'        # nome da imagem
  tag: '$(Build.BuildId)'    # tag única por build

steps:
- checkout: self

- task: Docker@2
  displayName: 'Build e Push da imagem Docker'
  inputs:
    command: 'buildAndPush'
    containerRegistry: 'Thot Academy'  # nome configurado no Azure DevOps
    repository: '$(imageName)'
    dockerfile: 'API/Dockerfile'                # ou o caminho exato: 'app/Dockerfile'
    tags: |
      $(tag)
      latest
